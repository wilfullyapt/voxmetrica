name: voxmetrica
version: 0.3.0
description: >
  VoxMetrica — family vocal biometrics for Hermes/Portunus. Per-voice capability
  memory, immutable root control plane, dual-band identify, clarify/adapt/sync,
  turn-time inject + tool gate.
author: VoxMetrica contributors
provides_tools:
  - voxmetrica_status
  - voxmetrica_whoami
  - voxmetrica_list
  - voxmetrica_enroll
  - voxmetrica_delete
  - voxmetrica_get_capabilities
  - voxmetrica_set_capabilities
  - voxmetrica_check
  - voxmetrica_clarify_resolve
  - voxmetrica_adapt
  - voxmetrica_sync_export
  - voxmetrica_sync_import
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
